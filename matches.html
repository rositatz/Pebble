<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pebble — Matches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inria+Serif:ital,wght@0,300;1,300&family=Open+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./images/logo_pebble_transparente.png" />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --orange: #ff751f;
        --orange-mid: #ff9700;
        --orange-light: #ffbb30;
        --bg: #eeedec;
        --surf-1: #ffffff;
        --surf-2: #f5f4f3;
        --surf-dark: #000000;
        --border: rgba(0, 0, 0, 0.08);
        --border2: rgba(0, 0, 0, 0.13);
        --text-primary: #000000;
        --text-secondary: #4d4d4d;
        --text-muted: rgba(0, 0, 0, 0.35);
        --text-inv: #eeedec;
        --font-display: "Bricolage Grotesque", sans-serif;
        --font-serif: "Inria Serif", serif;
        --font-body: "Open Sans", sans-serif;
        --nav-top: 62px;
        --nav-bot: 68px;
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 14px;
        --r-xl: 18px;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.5;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Top nav ── */
      .app-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        height: var(--nav-top);
        background: var(--surf-1);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }
      .nav-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav-back {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        transition:
          background 0.2s,
          color 0.2s;
        touch-action: manipulation;
        text-decoration: none;
      }
      .nav-back:hover {
        background: var(--surf-2);
        color: var(--text-primary);
      }
      .nav-title {
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .nav-logo {
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .nav-logo .bb {
        color: var(--orange);
      }
      .nav-logo .rest {
        color: var(--text-primary);
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: transparent;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        position: relative;
        transition:
          background 0.2s,
          color 0.2s;
        touch-action: manipulation;
      }
      .nav-icon-btn:hover {
        background: var(--surf-2);
        color: var(--text-primary);
      }
      .notif-pip {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--orange);
        border: 2px solid var(--surf-1);
      }
      .nav-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        overflow: hidden;
        clip-path: circle(50%);
        -webkit-clip-path: circle(50%);
        background: var(--text-primary);
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 0.85rem;
        font-weight: 800;
        color: #fff;
        cursor: pointer;
        /* Antes tenía "border: 2px solid transparent" para el hover en
           naranja -- por default el fondo se dimensiona sobre el
           padding-box (sin contar el borde), así que ese anillo de 2px
           quedaba SIN la foto, mostrando el negro de acá abajo. Se notaba
           menos en el hover porque el borde naranja pintaba justo encima de
           ese anillo, tapándolo. Sacar el borde saca el anillo directamente
           -- mismo enfoque que ya usaba chats.html, que nunca tuvo borde acá. */
        transition: opacity 0.2s;
        touch-action: manipulation;
        text-decoration: none;
      }
      .nav-avatar:hover {
        opacity: 0.8;
      }

      /* ── Main ── */
      .app-main {
        margin-top: var(--nav-top);
        margin-bottom: var(--nav-bot);
        max-width: 780px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      /* ── Sort / filter bar ── */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .sort-chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .sort-chips::-webkit-scrollbar {
        display: none;
      }
      .sort-chip {
        flex-shrink: 0;
        padding: 6px 13px;
        background: var(--surf-1);
        border: 1px solid var(--border2);
        border-radius: 20px;
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
        transition: all 0.18s;
        touch-action: manipulation;
        white-space: nowrap;
      }
      .sort-chip:hover {
        border-color: var(--orange);
        color: var(--text-primary);
      }
      .sort-chip.active {
        background: var(--text-primary);
        border-color: var(--text-primary);
        color: #fff;
      }
      .match-count {
        font-family: var(--font-display);
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* ── Estado vacío (sin matches reales todavía) ── */
      .matches-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
        padding: 64px 24px;
        color: var(--text-muted);
      }
      .matches-empty svg {
        stroke: var(--text-muted);
        margin-bottom: 4px;
      }
      .matches-empty-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 1.05rem;
        color: var(--text-primary);
      }
      .matches-empty-sub {
        font-size: 0.85rem;
        max-width: 320px;
        line-height: 1.5;
      }

      /* ── Match card ── */
      .match-card {
        background: var(--surf-1);
        border: 1px solid var(--border);
        border-radius: var(--r-xl);
        overflow: hidden;
        transition:
          box-shadow 0.22s,
          transform 0.22s;
      }
      .match-card:hover {
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.09);
        transform: translateY(-2px);
      }

      /* Match nuevo: mismo fondo y colores que siempre, solo con el borde
   resaltado en naranja para que se note que es nuevo. */
      .match-card[data-new="true"] {
        border-color: var(--orange);
        box-shadow:
          0 0 0 1px rgba(255, 117, 31, 0.3),
          0 8px 28px rgba(255, 117, 31, 0.12);
      }
      .match-card[data-new="true"]:hover {
        box-shadow:
          0 0 0 1px rgba(255, 117, 31, 0.45),
          0 10px 34px rgba(255, 117, 31, 0.18);
      }

      /* Card top row */
      .card-top {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 20px 16px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .card-av {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 800;
        color: #fff;
        position: relative;
        /* Con "border" puesto, el fondo por default se dimensiona sobre el
           padding-box (sin contar el borde) -- forzar border-box acá evita
           que quede un anillo del ancho del borde sin foto. */
        background-origin: border-box;
        background-clip: border-box;
        border: 2.5px solid transparent;
        transition:
          border-color 0.2s,
          transform 0.2s;
      }
      .card-top:hover .card-av {
        border-color: var(--orange);
        transform: scale(1.04);
      }
      .card-av-new::after {
        content: "";
        position: absolute;
        bottom: 2px;
        right: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--orange);
        border: 2px solid var(--surf-1);
      }

      .card-info {
        flex: 1;
        min-width: 0;
      }
      .card-name {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }
      .card-meta {
        font-family: var(--font-body);
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .card-tags {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-top: 7px;
      }
      .card-tag {
        font-family: var(--font-body);
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        padding: 3px 9px;
        border-radius: 20px;
        background: var(--surf-2);
        color: var(--text-secondary);
        border: 1px solid var(--border2);
      }

      /* Score ring */
      .score-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }
      .score-ring {
        position: relative;
        width: 56px;
        height: 56px;
      }
      .score-ring svg {
        width: 56px;
        height: 56px;
        transform: rotate(-90deg);
      }
      .score-ring-bg {
        fill: none;
        stroke: var(--surf-2);
        stroke-width: 4;
      }
      .score-ring-fill {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.6s ease;
      }
      .score-number {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--text-primary);
        letter-spacing: -0.02em;
      }
      .score-label {
        font-family: var(--font-body);
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      /* Reasons section */
      .card-reasons {
        padding: 0 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .reasons-title {
        font-family: var(--font-body);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 2px;
      }
      .reason-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .reason-icon {
        width: 28px;
        height: 28px;
        border-radius: var(--r-sm);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 117, 31, 0.08);
      }
      .reason-icon svg {
        width: 14px;
        height: 14px;
        color: var(--orange);
      }
      .reason-text {
        font-family: var(--font-body);
        font-size: 0.8rem;
        color: var(--text-secondary);
        line-height: 1.45;
        padding-top: 5px;
      }
      .reason-text strong {
        color: var(--text-primary);
        font-weight: 600;
      }

      /* Score bar (mini) inside reasons */
      .reason-score-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }
      .reason-bar-wrap {
        flex: 1;
        height: 5px;
        background: var(--surf-2);
        border-radius: 3px;
        overflow: hidden;
      }
      .reason-bar {
        height: 100%;
        border-radius: 3px;
        background: var(--orange);
      }
      .reason-bar-label {
        font-family: var(--font-display);
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--orange);
        width: 28px;
        text-align: right;
      }

      /* CTA row */
      .card-actions {
        padding: 14px 20px 20px;
        display: flex;
        gap: 10px;
        border-top: 1px solid var(--border);
      }
      .btn-profile {
        flex: 1;
        padding: 10px;
        background: var(--surf-2);
        border: 1px solid var(--border2);
        border-radius: var(--r-sm);
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition:
          border-color 0.2s,
          color 0.2s,
          background 0.2s;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-profile:hover {
        border-color: var(--text-primary);
        color: var(--text-primary);
        background: var(--surf-1);
      }
      .btn-chat {
        flex: 2;
        padding: 10px;
        background: var(--text-primary);
        border: none;
        border-radius: var(--r-sm);
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 0.78rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition:
          background 0.2s,
          transform 0.15s;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        clip-path: polygon(
          0 0,
          calc(100% - 8px) 0,
          100% 8px,
          100% 100%,
          8px 100%,
          0 calc(100% - 8px)
        );
      }
      .btn-chat:hover {
        background: var(--orange);
        transform: translateY(-1px);
      }
      .btn-chat:active {
        transform: translateY(0);
      }

      /* ── Profile modal ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: rgba(0, 0, 0, 0.5);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      .modal-overlay.open {
        opacity: 1;
        pointer-events: all;
      }
      .lightbox-overlay {
        position: fixed;
        inset: 0;
        z-index: 700;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .lightbox-overlay.open {
        opacity: 1;
        pointer-events: all;
      }
      .lightbox-img {
        max-width: 100%;
        max-height: 100%;
        border-radius: var(--r-md);
        object-fit: contain;
      }
      .modal-av,
      .profile-photo-thumb {
        cursor: pointer;
      }
      .modal-sheet {
        background: var(--surf-1);

        width: 100%;
        max-width: 720px;

        max-height: 82vh;

        border-radius: 24px;

        overflow-y: auto;
        overflow-x: hidden;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);

        padding-bottom: 24px;

        transform: translateY(20px) scale(0.98);

        transition:
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.3s;

        /* scrollbar firefox */
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 0, 0, 0.18) transparent;
      }

      /* scrollbar chrome/edge/safari */
      .modal-sheet::-webkit-scrollbar {
        width: 8px;
      }

      .modal-sheet::-webkit-scrollbar-track {
        background: transparent;
        margin: 12px 0;
      }

      .modal-sheet::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.16);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      .modal-sheet::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.26);
        background-clip: padding-box;
      }
      .modal-body {
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .modal-overlay.open .modal-sheet {
        transform: translateY(0) scale(1);
      }
      .modal-handle {
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: var(--border2);
        margin: 12px auto 20px;
      }
      .modal-header {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 24px 20px;
        border-bottom: 1px solid var(--border);
      }
      .modal-av {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        overflow: hidden;
        clip-path: circle(50%);
        -webkit-clip-path: circle(50%);
        background-repeat: no-repeat;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.6rem;
        font-weight: 800;
        color: #fff;
      }
      .modal-name-wrap {
        flex: 1;
      }
      .modal-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .modal-meta {
        font-family: var(--font-body);
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .modal-score-big {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 800;
        color: var(--orange);
        letter-spacing: -0.03em;
      }
      .modal-score-sub {
        font-family: var(--font-body);
        font-size: 0.62rem;
        color: var(--text-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .modal-body {
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .modal-section-title {
        font-family: var(--font-body);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 10px;
      }

      /* Compat bars */
      .compat-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .compat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .compat-item-header {
        display: flex;
        justify-content: space-between;
      }
      .compat-item-label {
        font-family: var(--font-body);
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-primary);
      }
      .compat-item-pct {
        font-family: var(--font-display);
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--orange);
      }
      .compat-bar-wrap {
        height: 6px;
        background: var(--surf-2);
        border-radius: 3px;
        overflow: hidden;
      }
      .compat-bar {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(
          to right,
          var(--orange-light),
          var(--orange)
        );
        transition: width 0.8s ease;
      }

      /* Interests */
      .interest-tags {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .interest-tag {
        padding: 5px 12px;
        border-radius: 20px;
        background: var(--surf-2);
        border: 1px solid var(--border2);
        font-family: var(--font-body);
        font-size: 0.78rem;
        color: var(--text-secondary);
      }
      .interest-tag.shared {
        background: rgba(255, 117, 31, 0.08);
        border-color: rgba(255, 117, 31, 0.25);
        color: var(--orange);
      }

      /* Profile photos grid */
      .profile-photos-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        grid-template-rows: 110px 110px;
        gap: 6px;
      }
      .profile-photo-thumb {
        border-radius: var(--r-md);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.8rem;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: -0.02em;
        user-select: none;
      }
      .profile-photo-thumb:first-child {
        grid-row: 1 / 3;
        font-size: 2.8rem;
      }

      /* Gemelo chat preview */
      .gemelo-preview {
        background: var(--surf-2);
        border-radius: var(--r-lg);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .gemelo-preview-title {
        font-family: var(--font-body);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 2px;
      }
      .preview-bubble {
        padding: 10px 14px;
        border-radius: 18px;
        max-width: 85%;
        font-family: var(--font-serif);
        font-size: 0.875rem;
        font-style: italic;
        font-weight: 300;
        line-height: 1.68;
        word-wrap: break-word;
      }
      .preview-bubble.left {
        background: var(--surf-1);
        color: var(--text-secondary);
        border-bottom-left-radius: 3px;
        align-self: flex-start;
      }
      .preview-bubble.right {
        background: var(--orange);
        color: #fff;
        border-bottom-right-radius: 3px;
        align-self: flex-end;
      }

      /* Modal CTA */
      .modal-cta-row {
        padding: 24px 24px 0;
        display: flex;
        gap: 10px;
      }

      /* ── Bottom nav ── */
      .app-bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 200;
        height: var(--nav-bot);
        background: var(--surf-1);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .bnav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.2s;
        touch-action: manipulation;
        min-height: 48px;
      }
      .bnav-item:hover {
        color: var(--text-secondary);
      }
      .bnav-item.active {
        color: var(--orange);
      }
      .bnav-icon {
        position: relative;
        line-height: 1;
      }
      .bnav-icon svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .bnav-pip {
        position: absolute;
        top: -3px;
        right: -5px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--orange);
        border: 2px solid var(--surf-1);
      }
      .bnav-label {
        font-family: var(--font-body);
        font-size: 0.58rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .bnav-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: none;
        touch-action: manipulation;
        min-height: 48px;
      }
      .bnav-center-orb {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: -20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        border: 3px solid var(--bg);
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }
      .bnav-center:hover .bnav-center-orb {
        transform: scale(1.08);
        background: var(--orange);
        box-shadow: 0 6px 28px rgba(255, 117, 31, 0.4);
      }
      .bnav-center-orb svg {
        width: 22px;
        height: 22px;
      }
      .bnav-center-label {
        font-family: var(--font-body);
        font-size: 0.58rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .bnav-center:hover .bnav-center-label {
        color: var(--orange);
      }

      /* ── Animations ── */
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fu {
        opacity: 0;
        animation: fade-up 0.4s ease forwards;
      }
      .fu:nth-child(1) {
        animation-delay: 0.04s;
      }
      .fu:nth-child(2) {
        animation-delay: 0.09s;
      }
      .fu:nth-child(3) {
        animation-delay: 0.14s;
      }
      .fu:nth-child(4) {
        animation-delay: 0.19s;
      }
      .fu:nth-child(5) {
        animation-delay: 0.24s;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
      #loadingOverlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease;
      }
      #loadingOverlay.hide {
        opacity: 0;
        pointer-events: none;
      }
      .loading-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: var(--orange);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ══════════════════════════════════════
   RESPONSIVE — MOBILE
══════════════════════════════════════ */
      @media (max-width: 600px) {
        /* Nav */
        .app-nav {
          padding: 0 16px;
        }

        /* Main padding */
        .app-main {
          padding: 20px 12px;
        }

        /* Cards de matches — menos padding interno */
        .match-card {
          padding: 16px 16px 14px;
        }

        /* Foto + info dentro del card */
        .match-card-top {
          gap: 12px;
        }

        /* Grid de fotos 2fr 1fr 1fr: ajuste para pantallas chicas */
        .photo-grid {
          grid-template-columns: 1.8fr 1fr 1fr;
          gap: 4px;
        }

        /* Modal de match — ocupa toda la pantalla */
        .modal-inner {

        .modal-body {

        /* Filtros de matches */
        .filter-bar {
          padding: 0 12px 14px;
          gap: 6px;
        }
        .filter-chip {
          padding: 5px 11px;
          font-size: 0.75rem;
        }
      }
    </style>
  </head>

            /></svg></span

    <script>
      // Escapa texto para insertarlo tanto en contenido de texto como dentro
      // de atributos HTML entre comillas (aria-label, etc.) -- nombre/bio/
      // ciudad vienen de Firestore y los escribe libremente cada usuario
      // desde perfil.html, así que hay que tratarlos como no confiables.
      function esc(t) {
        return String(t)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Devuelve un color dinámico según el porcentaje de afinidad
      // A mayor porcentaje, el color se vuelve naranja más intenso
      // 55% → dorado claro  |  100% → naranja profundo
      function scoreColor(pct) {
        const t = Math.max(0, Math.min(1, (pct - 55) / 45));
        const h = Math.round(40 - 20 * t);
        const l = Math.round(68 - 20 * t);
        return `hsl(${h}, 100%, ${l}%)`;
      }

      // Inicializa los colores de todos los anillos de afinidad y las mini barras de razones
      // Se ejecuta al cargar la página para aplicar los colores dinámicos a cada match card
      function initScoreRings() {
        // Anillo principal de afinidad
        document.querySelectorAll(".score-ring").forEach((ring) => {
          const numEl = ring.querySelector(".score-number");
          if (!numEl) return;
          const pct = parseInt(numEl.textContent);
          if (isNaN(pct)) return;
          const color = scoreColor(pct);
          const fill = ring.querySelector(".score-ring-fill");
          if (fill) fill.setAttribute("stroke", color);
          numEl.style.color = color;
        });
        // Mini barras de razones dentro de cada card
        document.querySelectorAll(".reason-score-row").forEach((row) => {
          const label = row.querySelector(".reason-bar-label");
          const bar = row.querySelector(".reason-bar");
          if (!label || !bar) return;
          const pct = parseInt(label.textContent);
          if (isNaN(pct)) return;
          const color = scoreColor(pct);
          bar.style.background = color;
          label.style.color = color;
        });
      }
      initScoreRings();

      // Navega a otra pantalla de la app según el nombre de la página
      function goTo(page) {
        const map = {
          chats: "./chats.html",
          gemelo: "./gemelo.html",
          matches: "./matches.html",
        };
        const url = map[page];
        if (url)
          alert(
            `Próximamente: ${url}\nDescomentar: window.location.href = '${url}'`,
          );
      }

      // Se llena con datos reales de Firestore -- ver cargarMatchesReales()
      // más abajo. openProfile() lee de acá igual que antes.
      // "var" (no "let") a propósito: un top-level "let" en un <script>
      // clásico NO queda expuesto en window, así que el otro <script
      // type="module"> de más abajo (que arma "profiles" con datos reales de
      // Firestore) no podría verlo -- "var" sí queda en window.
      var profiles = {};

      // Abre el modal con el perfil completo del match seleccionado
      // Construye dinámicamente el header, bio, barras de compatibilidad, intereses,
      // fragmento de conversación entre gemelos y fotos
      function openProfile(id) {
        const p = profiles[id];
        if (!p) return;

        // Header
        const scoreCol = scoreColor(p.score);
        document.getElementById("modal-header").innerHTML = `
    <div class="modal-av" ${p.photo ? `onclick="openLightbox('${p.photo}')"` : ""} style="${p.photo ? `background-image:url('${p.photo}');background-size:cover;background-position:center` : "background:linear-gradient(135deg,#888,#555)"}">${p.photo ? "" : esc((p.name[0] || "?").toUpperCase())}</div>
    <div class="modal-name-wrap">
      <div class="modal-name">${esc(p.name)}${p.age ? ", " + p.age : ""}</div>
      <div class="modal-meta">${esc([p.city, p.identidad].filter(Boolean).join(" · "))}</div>
    </div>
    <div style="text-align:center">
      <div class="modal-score-big" style="color:${scoreCol}">${p.score}%</div>
      <div class="modal-score-sub">Afinidad</div>
    </div>
  `;

        // Body
        let html = "";

        // Bio (solo si escribió una)
        if (p.bio) {
          html += `<div>
    <p class="modal-section-title">Sobre ${esc(p.name)}</p>
    <p style="font-family:var(--font-serif);font-size:0.95rem;font-style:italic;font-weight:300;color:var(--text-secondary);line-height:1.7">${esc(p.bio)}</p>
  </div>`;
        }

        // Compat bars (los 3 ejes reales que calcula calcular_compatibilidad)
        if (p.compat && p.compat.length) {
          html += `<div>
    <p class="modal-section-title">Razones de compatibilidad</p>
    <div class="compat-row">`;
          p.compat.forEach((c) => {
            const cc = scoreColor(c.pct);
            html += `<div class="compat-item">
      <div class="compat-item-header">
        <span class="compat-item-label">${c.label}</span>
        <span class="compat-item-pct" style="color:${cc}">${c.pct}%</span>
      </div>
      <div class="compat-bar-wrap"><div class="compat-bar" style="width:0%;background:${cc}" data-target="${c.pct}%"></div></div>
    </div>`;
          });
          html += `</div></div>`;
        }

        // Interests (intereses reales del usuario, en naranja los compartidos)
        if (p.interests && p.interests.length) {
          html += `<div>
    <p class="modal-section-title">Intereses <span style="color:var(--orange);font-style:normal">— en naranja los que compartís</span></p>
    <div class="interest-tags">`;
          p.interests.forEach((i) => {
            const shared = p.shared.includes(i);
            html += `<span class="interest-tag${shared ? " shared" : ""}">${esc(i)}</span>`;
          });
          html += `</div></div>`;
        }

        // Gemelo preview (solo si hay una simulación real de la que sacarlo)
        if (p.preview && p.preview.length) {
          html += `<div>
    <p class="modal-section-title">Fragmento de la conversación entre gemelos</p>
    <div class="gemelo-preview">`;
          p.preview.forEach((b) => {
            html += `<div class="preview-bubble ${b.side}">${esc(b.text)}</div>`;
          });
          html += `</div></div>`;
        }

        // Photos
        if (p.photos && p.photos.length) {
          html += `<div>
      <p class="modal-section-title">Fotos</p>
      <div class="profile-photos-grid">`;
          p.photos.forEach((url) => {
            html += `<div class="profile-photo-thumb" onclick="openLightbox('${url}')" style="background:url('${url}') center/cover no-repeat"></div>`;
          });
          html += `</div></div>`;
        }

        document.getElementById("modal-body").innerHTML = html;
        document.getElementById("modal-chat-label").textContent =
          `Escribirle a ${p.name}`;
        document.getElementById("modal-chat-btn").onclick = () => {
          window.location.href = `./chats.html?persona=${id}&modo=real`;
        };

        // Ver el perfil también saca el resaltado naranja de "match nuevo"
        if (typeof window._db_marcarMatchVisto === "function") {
          window._db_marcarMatchVisto(id);
        }

        // Open modal
        const overlay = document.getElementById("modal");
        overlay.classList.add("open");
        document.body.style.overflow = "hidden";

        // Animate bars after render
        requestAnimationFrame(() => {
          document
            .querySelectorAll(".compat-bar[data-target]")
            .forEach((bar) => {
              setTimeout(() => {
                bar.style.width = bar.dataset.target;
              }, 100);
            });
        });
      }

      // Cierra el modal del perfil y restaura el scroll del body
      function closeModal() {
        document.getElementById("modal").classList.remove("open");
        document.body.style.overflow = "";
      }

      // Cierra el modal si el usuario hace click en el overlay oscuro (fuera del contenido)
      function closeIfOverlay(e) {
        if (e.target === document.getElementById("modal")) closeModal();
      }

      // Cierra el modal al presionar la tecla Escape
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // Agranda una foto (la de perfil o cualquiera de la grilla) a pantalla
      // completa. `url` es la foto tal cual (data URL o http), no el string
      // de background CSS -- por eso los onclick que llaman a esto extraen
      // la URL antes de armar el estilo, no le pasan el `bg` completo.
      window.openLightbox = function (url) {
        if (!url) return;
        document.getElementById("lightboxImg").src = url;
        document.getElementById("lightboxOverlay").classList.add("open");
      };
      window.closeLightbox = function () {
        document.getElementById("lightboxOverlay").classList.remove("open");
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });

      // Si la página fue abierta con ?persona=ID (desde home/chats), abre ese
      // perfil automáticamente -- se llama desde cargarMatchesReales() (script
      // de más abajo) una vez que "profiles" ya tiene datos reales, no acá,
      // porque a esta altura todavía no cargó nada de Firestore.
      function abrirPerfilDesdeQueryParam() {
        const param = new URLSearchParams(location.search).get("persona");
        if (param && profiles[param]) {
          setTimeout(() => openProfile(param), 150);
        }
      }

      // Ordena o filtra las match cards según el criterio elegido
      // 'afinidad' y 'nuevos': reordena todas las cards con animación de fade
      // 'activos': filtra — muestra solo las que tienen data-active="true", oculta el resto
      function sortMatches(mode, btn) {
        document.querySelectorAll(".sort-chip").forEach((c) => {
          c.classList.remove("active");
          c.setAttribute("aria-selected", "false");
        });
        btn.classList.add("active");
        btn.setAttribute("aria-selected", "true");
        const list = document.querySelector(".app-main");
        const cards = [...list.querySelectorAll(".match-card")];

        if (mode === "activos") {
          // Filtrar: mostrar solo las que tienen chat activo, ocultar el resto
          cards.forEach((c) => {
            if (c.dataset.active === "true") {
              c.style.display = "";
              c.style.opacity = "0";
              requestAnimationFrame(() => {
                c.style.transition = "opacity 0.3s";
                c.style.opacity = "1";
              });
            } else {
              c.style.display = "none";
            }
          });
        } else {
          // Restaurar visibilidad de todas las cards antes de reordenar
          cards.forEach((c) => {
            c.style.display = "";
          });
          cards.forEach((c) => c.remove());
          let sorted;
          if (mode === "afinidad") {
            sorted = cards.sort(
              (a, b) => Number(b.dataset.score) - Number(a.dataset.score),
            );
          } else if (mode === "nuevos") {
            sorted = cards.sort(
              (a, b) => (b.dataset.new === "true") - (a.dataset.new === "true"),
            );
          } else {
            sorted = cards;
          }
          sorted.forEach((c) => {
            c.style.opacity = "0";
            list.appendChild(c);
            requestAnimationFrame(() => {
              c.style.transition = "opacity 0.3s";
              c.style.opacity = "1";
            });
          });
        }
      }
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        collection,
        getDocs,
        query,
        where,
        orderBy,
        limit,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      // Si el usuario tiene foto de perfil (perfil.html), la muestra en el
      // ícono de arriba a la derecha; si no, la inicial real de su nombre
      // (antes quedaba la "M" fija del HTML sin importar quién estuviera
      // logueado).
      function renderNavAvatar(avatarFoto, nombre) {
        const el = document.getElementById("nav-avatar");
        if (!el) return;
        if (avatarFoto) {
          el.style.backgroundImage = `url(${avatarFoto})`;
          el.style.backgroundSize = "cover";
          el.style.backgroundPosition = "center";
          el.textContent = "";
        } else {
          el.style.backgroundImage = "";
          el.textContent = ((nombre || "U")[0] || "U").toUpperCase();
        }
      }

      function calcAge(fechaNac) {
        if (!fechaNac) return null;
        const b = new Date(fechaNac),
          hoy = new Date();
        let a = hoy.getFullYear() - b.getFullYear();
        const m = hoy.getMonth() - b.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < b.getDate())) a--;
        return a;
      }

      const app = initializeApp({
        apiKey: "AIzaSyDmjdP3DraX6DkBbW6fffI_gKoRcCp6UY0",
        authDomain: "pebble-78e95.firebaseapp.com",
        projectId: "pebble-78e95",
        storageBucket: "pebble-78e95.firebasestorage.app",
        messagingSenderId: "56434257024",
        appId: "1:56434257024:web:3e2625f73bad3d4c004a65",
      });
      const auth = getAuth(app);
      const db = getFirestore(app);

      const EJES_COMPAT = [
        { key: "score_psicologico", label: "Compatibilidad de personalidades" },
        { key: "score_conversacional", label: "Química en la conversación" },
        { key: "score_valores", label: "Valores compartidos" },
      ];
      const SEMANA_MS = 7 * 24 * 60 * 60 * 1000;

      function haceTiempo(ms) {
        if (!ms) return "";
        const diff = Date.now() - ms;
        const min = Math.floor(diff / 60000);
        if (min < 1) return "match recién";
        if (min < 60) return `match hace ${min} min`;
        const hs = Math.floor(min / 60);
        if (hs < 24) return `match hace ${hs}h`;
        const dias = Math.floor(hs / 24);
        return `match hace ${dias} día${dias === 1 ? "" : "s"}`;
      }

      function iconoCheck() {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
      }

      function construirEjes(sim) {
        if (!sim || !sim.score) return [];
        return EJES_COMPAT.filter(
          (e) => typeof sim.score[e.key] === "number",
        ).map((e) => ({
          label: e.label,
          pct: Math.round(sim.score[e.key] * 100),
        }));
      }

      function interesesCompartidos(mios, suyos) {
        const set = new Set(suyos || []);
        return (mios || []).filter((i) => set.has(i));
      }

      // Marca un match como visto: saca el resaltado naranja y lo guarda en
      // Firestore (usuarios/{uid}.match_visto_{otroId}) para que no vuelva a
      // aparecer resaltado en una próxima visita. Se llama tanto desde las
      // cards nuevas (botones armados acá abajo) como desde openProfile()
      // (definida en el otro script, por eso el bridge por window).
      async function marcarMatchVisto(otroId) {
        const user = auth.currentUser;
        if (user) {
          try {
            await setDoc(
              doc(db, "usuarios", user.uid),
              { [`match_visto_${otroId}`]: true },
              { merge: true },
            );
          } catch (e) {
            console.warn("Error marcando match visto:", e);
          }
        }
        const card = document.querySelector(`.match-card[data-id="${otroId}"]`);
        if (card) {
          card.dataset.new = "false";
          const av = card.querySelector(".card-av");
          if (av) av.classList.remove("card-av-new");
        }
      }
      window.marcarMatchVisto = marcarMatchVisto;
      window._db_marcarMatchVisto = marcarMatchVisto;

      function buildMatchCardHTML(m) {
        const circunferencia = 138.2;
        const offset = (circunferencia * (1 - m.score / 100)).toFixed(1);
        const avatarStyle = m.foto
          ? `background-image:url('${m.foto}');background-size:cover;background-position:center`
          : `background:linear-gradient(135deg,#888,#555)`;
        const tagsHtml = (m.tags || [])
          .slice(0, 3)
          .map((t) => `<span class="card-tag">${esc(t)}</span>`)
          .join("");
        const reasonsHtml = m.ejes.length
          ? m.ejes
              .map(
                (e) => `
              <div class="reason-row">
                <div class="reason-icon">${iconoCheck()}</div>
                <div class="reason-text">
                  <strong>${e.label}</strong>
                  <div class="reason-score-row">
                    <div class="reason-bar-wrap"><div class="reason-bar" style="width:${e.pct}%"></div></div>
                    <span class="reason-bar-label">${e.pct}%</span>
                  </div>
                </div>
              </div>`,
              )
              .join("")
          : `<p style="font-size:0.8rem;color:var(--text-muted)">Todavía no hay suficientes conversaciones simuladas para desglosar la compatibilidad.</p>`;

        return `
          <div class="match-card fu" data-id="${m.id}" data-score="${m.score}" data-new="${m.isNew}" data-active="${m.hasChat}">
            <div class="card-top" onclick="openProfile('${m.id}')" role="button" tabindex="0" aria-label="Ver perfil de ${esc(m.nombre)}">
              <div class="card-av${m.isNew ? " card-av-new" : ""}" style="${avatarStyle}" aria-hidden="true">${m.foto ? "" : esc((m.nombre[0] || "?").toUpperCase())}</div>
              <div class="card-info">
                <div class="card-name">${esc(m.nombre)}${m.edad ? ", " + m.edad : ""}</div>
                <div class="card-meta">${esc([m.ciudad, m.metaTexto].filter(Boolean).join(" · "))}</div>
                ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ""}
              </div>
              <div class="score-wrap">
                <div class="score-ring" aria-label="${m.score}% de compatibilidad">
                  <svg viewBox="0 0 56 56">
                    <circle class="score-ring-bg" cx="28" cy="28" r="22"/>
                    <circle class="score-ring-fill" cx="28" cy="28" r="22" stroke="#FF751F" stroke-dasharray="${circunferencia}" stroke-dashoffset="${offset}"/>
                  </svg>
                  <span class="score-number">${m.score}%</span>
                </div>
                <span class="score-label">Afinidad</span>
              </div>
            </div>
            <div class="card-reasons">
              <p class="reasons-title">Por qué son compatibles</p>
              ${reasonsHtml}
            </div>
            <div class="card-actions">
              <button class="btn-profile" onclick="openProfile('${m.id}')" aria-label="Ver perfil de ${esc(m.nombre)}">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Perfil
              </button>
              <button class="btn-chat" onclick="marcarMatchVisto('${m.id}');window.location.href='./chats.html?persona=${m.id}&modo=real'" aria-label="Hablar con ${esc(m.nombre)}">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Escribirle a ${esc(m.nombre)}
              </button>
            </div>
          </div>`;
      }

      // Arma las matches reales desde Firestore: conexiones donde el usuario
      // es participante y superaron el umbral de compatibilidad. Si pasó una
      // semana desde que se creó la conexión y todavía no hay chat real
      // arrancado, esa match deja de mostrarse (se "vence").
      async function cargarMatchesReales(user) {
        const emptyEl = document.getElementById("matchesEmpty");
        const countEl = document.getElementById("match-count");
        const main = document.querySelector(".app-main");

        const misSnap = await getDoc(doc(db, "usuarios", user.uid));
        const mis = misSnap.exists() ? misSnap.data() : {};
        const misIntereses = mis.intereses || [];

        const conexionesSnap = await getDocs(
          query(
            collection(db, "conexiones"),
            where("participantes", "array-contains", user.uid),
          ),
        );

        const ahora = Date.now();
        const candidatos = [];
        conexionesSnap.forEach((d) => {
          const data = d.data();
          if (!data.supera_umbral) return;
          const otroId =
            data.usuario_1.uid === user.uid
              ? data.usuario_2.uid
              : data.usuario_1.uid;
          const tieneChatReal =
            Array.isArray(data.real?.msgs) && data.real.msgs.length > 0;
          const hasChat =
            tieneChatReal ||
            (Array.isArray(data.gemelo?.msgs) && data.gemelo.msgs.length > 0);
          const creadoMs =
            data.creado && data.creado.toMillis ? data.creado.toMillis() : null;
          // Match nueva sin chat real hace más de una semana: desaparece.
          if (creadoMs && !tieneChatReal && ahora - creadoMs > SEMANA_MS)
            return;
          candidatos.push({ parId: d.id, otroId, data, hasChat, creadoMs });
        });

        if (!candidatos.length) {
          if (emptyEl) emptyEl.style.display = "flex";
          if (countEl) countEl.textContent = "0 matches";
          abrirPerfilDesdeQueryParam();
          return;
        }
        if (emptyEl) emptyEl.style.display = "none";

        await Promise.all(
          candidatos.map(async (c) => {
            try {
              const s = await getDoc(doc(db, "usuarios", c.otroId));
              c.otro = s.exists() ? s.data() : {};
            } catch (e) {
              c.otro = {};
            }
            try {
              const simSnap = await getDocs(
                query(
                  collection(db, "conexiones", c.parId, "simulaciones"),
                  orderBy("fecha", "desc"),
                  limit(1),
                ),
              );
              c.ultimaSim = simSnap.empty ? null : simSnap.docs[0].data();
            } catch (e) {
              c.ultimaSim = null;
            }
          }),
        );

        if (countEl) {
          countEl.textContent = `${candidatos.length} match${candidatos.length === 1 ? "" : "es"}`;
        }

        let html = "";
        candidatos.forEach((c) => {
          const nombreGuardado =
            c.data.usuario_1.uid === c.otroId
              ? c.data.usuario_1.nombre
              : c.data.usuario_2.nombre;
          const nombre = c.otro.nombre || nombreGuardado || "Usuario";
          const edad =
            typeof calcAge === "function" ? calcAge(c.otro.fechaNac) : null;
          // Nombre y edad siempre se muestran -- el resto respeta lo que la
          // otra persona eligió en Privacidad (perfil.html). Ciudad/fotos/bio
          // nacen visibles (solo se ocultan si puso === false); género y
          // orientación nacen ocultos (solo se muestran si puso === true).
          const priv = c.otro.privacidad || {};
          const ciudad = priv.ciudad === false ? "" : c.otro.ciudad || "";
          const fotosVisibles = priv.fotos !== false;
          const foto = fotosVisibles
            ? c.otro.avatarFoto ||
              (Array.isArray(c.otro.fotos) && c.otro.fotos.find(Boolean)) ||
              ""
            : "";
          const score = Math.round((c.data.ultimo_score || 0) * 100);
          const isNew = !mis[`match_visto_${c.otroId}`];
          const tags = interesesCompartidos(misIntereses, c.otro.intereses);
          const ejes = construirEjes(c.ultimaSim);
          const historial =
            c.ultimaSim && Array.isArray(c.ultimaSim.historial_chat)
              ? c.ultimaSim.historial_chat
              : [];
          const identidadTxt = [
            priv.genero === true ? c.otro.genero : "",
            priv.orientacion === true ? c.otro.orientacion : "",
          ]
            .filter(Boolean)
            .join(" · ");

          profiles[c.otroId] = {
            name: nombre,
            age: edad,
            city: ciudad,
            identidad: identidadTxt,
            score,
            photo: foto,
            photos: fotosVisibles
              ? (Array.isArray(c.otro.fotos) ? c.otro.fotos : []).filter(
                  Boolean,
                )
              : [],
            bio: priv.bio === false ? "" : c.otro.bio || "",
            compat: ejes,
            interests: (c.otro.intereses || []).slice(0, 10),
            shared: tags,
            // msg.uid es lo confiable (agregado hace poco); msg.name
            // comparado contra mis.nombre podía no coincidir nunca (el
            // nombre del perfil del gemelo, de la etapa1 del onboarding, no
            // es necesariamente el mismo que el nombre de la cuenta), lo que
            // atribuía TODOS los mensajes al lado ajeno.
            preview: historial.slice(-3).map((msg) => ({
              side: msg.uid
                ? msg.uid === user.uid
                  ? "right"
                  : "left"
                : msg.name && mis.nombre && msg.name === mis.nombre
                  ? "right"
                  : "left",
              text: msg.content || "",
            })),
          };

          html += buildMatchCardHTML({
            id: c.otroId,
            nombre,
            edad,
            ciudad,
            foto,
            score,
            isNew,
            hasChat: c.hasChat,
            tags,
            ejes,
            metaTexto: c.creadoMs ? haceTiempo(c.creadoMs) : "",
          });
        });

        main.insertAdjacentHTML("beforeend", html);
        if (typeof initScoreRings === "function") initScoreRings();
        abrirPerfilDesdeQueryParam();
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "./home.html";
          return;
        }
        // Expiración de sesión (24h)
        const _SESSION_MS = 24 * 60 * 60 * 1000;
        const _loginTime = parseInt(
          localStorage.getItem("pebble_login_time") || "0",
        );
        if (!_loginTime) {
          localStorage.setItem("pebble_login_time", Date.now().toString());
        } else if (Date.now() - _loginTime > _SESSION_MS) {
          localStorage.removeItem("pebble_login_time");
          await signOut(auth);
          window.location.href = "./home.html";
          return;
        }

        // Foto de perfil en el ícono de arriba a la derecha
        try {
          const userSnap = await getDoc(doc(db, "usuarios", user.uid));
          const userData = userSnap.exists() ? userSnap.data() : {};
          const nombreNav =
            userData.nombre ||
            user.displayName ||
            (user.email ? user.email.split("@")[0] : "") ||
            "Usuario";
          renderNavAvatar(userData.avatarFoto, nombreNav);
        } catch (e) {
          console.warn("Error cargando avatar:", e);
        }

        // Matches reales desde Firestore (conexiones/{parId}, doc compartido
        // con la otra persona) -- arma las cards, marca cuáles son nuevas y
        // filtra las que vencieron sin chat real hace más de una semana.
        try {
          await cargarMatchesReales(user);
        } catch (e) {
          console.warn("Error cargando matches:", e);
          const emptyEl = document.getElementById("matchesEmpty");
          if (emptyEl) emptyEl.style.display = "flex";
        }

        const el = document.getElementById("loadingOverlay");
        if (el) {
          el.classList.add("hide");
          setTimeout(() => el.remove(), 350);
        }
      });
    </script>
  </body>
</html>
