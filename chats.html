<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pebble — Chats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inria+Serif:ital,wght@0,300;1,300&family=Open+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./images/logo_pebble_transparente.png" />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --orange: #ff751f;
        --orange-mid: #ff9700;
        --orange-light: #ffbb30;
        --bg: #eeedec;
        --surf-1: #ffffff;
        --surf-2: #f5f4f3;
        --surf-dark: #000000;
        --border: rgba(0, 0, 0, 0.08);
        --border2: rgba(0, 0, 0, 0.13);
        --text-primary: #000000;
        --text-secondary: #4d4d4d;
        --text-muted: rgba(0, 0, 0, 0.35);
        --text-inv: #eeedec;
        --font-display: "Bricolage Grotesque", sans-serif;
        --font-serif: "Inria Serif", serif;
        --font-body: "Open Sans", sans-serif;
        --nav-top: 62px;
        --nav-bot: 68px;
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 14px;
        --r-xl: 18px;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Top nav ── */
      .app-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        height: var(--nav-top);
        background: var(--surf-1);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .nav-title {
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nav-icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        transition:
          background 0.2s,
          color 0.2s;
        position: relative;
        text-decoration: none;
      }
      .nav-icon-btn:hover {
        background: var(--surf-2);
        color: var(--text-primary);
      }
      .nav-icon-btn svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .notif-pip {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--orange);
        border: 2px solid var(--surf-1);
      }
      .nav-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        overflow: hidden;
        clip-path: circle(50%);
        -webkit-clip-path: circle(50%);
        background: var(--surf-dark);
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--text-inv);
        text-decoration: none;
        flex-shrink: 0;
        transition: opacity 0.2s;
      }
      .nav-avatar:hover {
        opacity: 0.8;
      }

      /* ── Page content ── */
      .page-content {
        position: fixed;
        top: var(--nav-top);
        bottom: var(--nav-bot);
        left: 0;
        right: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* ── Search ── */
      .search-wrap {
        padding: 12px 16px 10px;
        background: var(--surf-1);
        border-bottom: 1px solid var(--border);
      }
      .search-input-wrap {
        position: relative;
      }
      .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        fill: none;
        stroke: var(--text-muted);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .search-input {
        width: 100%;
        padding: 9px 12px 9px 36px;
        border: 1.5px solid var(--border2);
        border-radius: 22px;
        font-family: var(--font-body);
        font-size: 0.875rem;
        background: var(--surf-2);
        color: var(--text-primary);
        outline: none;
        transition: border-color 0.18s;
      }
      .search-input::placeholder {
        color: var(--text-muted);
      }
      .search-input:focus {
        border-color: var(--orange);
        background: var(--surf-1);
      }

      /* ── Conv count ── */
      .conv-count {
        padding: 10px 16px 6px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      /* ── Conversation list ── */
      .conv-list {
        background: var(--surf-1);
      }
      .chats-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
        padding: 64px 24px;
        color: var(--text-muted);
      }
      .chats-empty svg {
        stroke: var(--text-muted);
        margin-bottom: 4px;
      }
      .chats-empty-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 1.05rem;
        color: var(--text-primary);
      }
      .chats-empty-sub {
        font-size: 0.85rem;
        max-width: 320px;
        line-height: 1.5;
      }
      .conv-item {
        display: flex;
        gap: 12px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
        touch-action: manipulation;
      }
      .conv-item:hover {
        background: var(--surf-2);
      }
      .conv-item:last-child {
        border-bottom: none;
      }
      .conv-av {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        overflow: hidden;
        clip-path: circle(50%);
        -webkit-clip-path: circle(50%);
        background-repeat: no-repeat;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 800;
        color: #fff;
        margin-top: 2px;
      }
      .conv-content {
        flex: 1;
        min-width: 0;
      }
      .conv-top {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-bottom: 3px;
      }
      .conv-name {
        font-family: var(--font-display);
        font-size: 0.98rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        flex-shrink: 0;
      }
      .conv-afinidad {
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--orange);
        background: rgba(255, 117, 31, 0.1);
        border-radius: 10px;
        padding: 1px 7px;
        flex-shrink: 0;
      }
      .conv-time {
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-left: auto;
        flex-shrink: 0;
      }
      .conv-preview-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .conv-preview {
        font-size: 0.82rem;
        color: var(--text-secondary);
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-preview.bold {
        color: var(--text-primary);
        font-weight: 600;
      }
      .conv-unread {
        min-width: 20px;
        height: 20px;
        border-radius: 10px;
        background: var(--orange);
        color: #fff;
        font-size: 0.68rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        flex-shrink: 0;
      }
      .conv-modes {
        display: flex;
        gap: 6px;
      }
      .conv-mode-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 14px;
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border2);
        background: none;
        color: var(--text-muted);
        transition: all 0.18s;
        touch-action: manipulation;
      }
      .conv-mode-btn svg {
        width: 11px;
        height: 11px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .conv-mode-btn.mode-active {
        background: var(--surf-dark);
        color: var(--text-inv);
        border-color: var(--surf-dark);
      }
      .conv-mode-btn.mode-locked {
        opacity: 0.45;
        cursor: default;
      }

      /* ── Chat panel ── */
      .chat-panel {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .chat-panel.open {
        transform: translateX(0);
      }

      .panel-nav {
        background: var(--surf-1);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        height: var(--nav-top);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px 0 8px;
      }
      .panel-back {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .panel-back:hover {
        background: var(--surf-2);
      }
      .panel-back svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .panel-av {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        overflow: hidden;
        clip-path: circle(50%);
        -webkit-clip-path: circle(50%);
        background-repeat: no-repeat;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 0.88rem;
        font-weight: 800;
        color: #fff;
      }
      .panel-person {
        flex: 1;
        min-width: 0;
      }
      .panel-person-name {
        font-family: var(--font-display);
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .panel-person-meta {
        font-size: 0.68rem;
        color: var(--text-muted);
      }
      .panel-mode-seg {
        display: flex;
        background: var(--surf-2);
        border-radius: 20px;
        padding: 2px;
        flex-shrink: 0;
      }
      .panel-mode-btn {
        padding: 5px 11px;
        border-radius: 18px;
        border: none;
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--text-muted);
        background: none;
        transition: all 0.18s;
        white-space: nowrap;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .panel-mode-btn svg {
        width: 11px;
        height: 11px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .panel-mode-btn.active {
        background: var(--surf-dark);
        color: #fff;
      }
      .panel-mode-btn.locked {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .panel-mode-bar {
        padding: 9px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 0.73rem;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .panel-mode-bar svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .panel-mode-bar.gemelo-bar {
        background: var(--surf-dark);
        border-bottom-color: rgba(255, 117, 31, 0.3);
        color: rgba(255, 255, 255, 0.8);
      }
      .panel-mode-bar.gemelo-bar svg {
        stroke: var(--orange);
      }
      .panel-mode-bar.real-bar {
        background: rgba(34, 197, 94, 0.07);
        border-bottom-color: rgba(34, 197, 94, 0.2);
        color: var(--text-secondary);
      }
      .panel-mode-bar.real-bar svg {
        stroke: #22c55e;
      }
      .mode-bar-badge {
        font-size: 0.62rem;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        flex-shrink: 0;
      }
      .pmsg-av-ai {
        outline: 2px solid var(--orange);
        outline-offset: 1px;
      }
      .pmsg-av-ai svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: #fff;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: block;
      }

      .panel-messages {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
      }
      .panel-msgs-inner {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        padding: 16px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* Day sep */
      .day-sep {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0 6px;
      }
      .day-sep-line {
        flex: 1;
        height: 1px;
        background: var(--border2);
      }
      .day-sep-text {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
        white-space: nowrap;
      }

      /* Bubbles */
      .pmsg {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 100%;
      }
      .pmsg.them {
        justify-content: flex-start;
      }
      .pmsg.me {
        justify-content: flex-end;
      }
      .pmsg-av {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        overflow: hidden;
        clip-path: circle(50%);
        -webkit-clip-path: circle(50%);
        background-repeat: no-repeat;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 0.72rem;
        font-weight: 800;
        color: #fff;
        align-self: flex-end;
        margin-bottom: 2px;
      }
      .pmsg-av-sp {
        width: 28px;
        flex-shrink: 0;
      }
      .pbubble {
        padding: 10px 14px;
        border-radius: 18px;
        max-width: min(72%, 460px);
        font-size: 0.875rem;
        line-height: 1.6;
        word-wrap: break-word;
        white-space: pre-line;
      }
      .pmsg.them .pbubble {
        background: var(--surf-1);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
        color: var(--text-primary);
      }
      .pmsg.me .pbubble {
        background: var(--surf-dark);
        border-bottom-right-radius: 4px;
        color: var(--text-inv);
      }
      .pmsg.them.is-gemelo .pbubble {
        border-left: 3px solid var(--orange);
      }
      .pmsg.has-photo .pbubble {
        padding: 4px;
        background: transparent;
        border: none;
      }
      .pbubble-photo {
        display: block;
        max-width: 220px;
        max-height: 280px;
        border-radius: 14px;
        cursor: pointer;
        object-fit: cover;
      }
      .pmsg-time {
        font-size: 0.6rem;
        color: var(--text-muted);
        align-self: flex-end;
        margin-bottom: 4px;
        flex-shrink: 0;
      }
      .pmsg.me .pmsg-time {
        order: -1;
      }

      /* Gemelo tag inside bubble */
      .gemelo-tag {
        display: block;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--orange);
        margin-bottom: 5px;
      }

      /* Typing */
      .typing-bubble {
        background: var(--surf-1);
        border: 1px solid var(--border);
        border-radius: 18px;
        border-bottom-left-radius: 4px;
        padding: 12px 16px;
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .typing-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
        animation: typing-bounce 1.2s infinite ease-in-out;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes typing-bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-6px);
        }
      }

      /* Panel input */
      .panel-input-wrap {
        background: var(--surf-1);
        border-top: 1px solid var(--border);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .panel-input {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid var(--border2);
        border-radius: 22px;
        font-family: var(--font-body);
        font-size: 0.88rem;
        color: var(--text-primary);
        background: var(--surf-2);
        outline: none;
        resize: none;
        transition: border-color 0.18s;
        line-height: 1.4;
        max-height: 100px;
        overflow-y: hidden;
      }
      .panel-input::placeholder {
        color: var(--text-muted);
      }
      .panel-input:focus {
        border-color: var(--orange);
        background: var(--surf-1);
      }
      .panel-send-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--surf-dark);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        touch-action: manipulation;
      }
      .panel-send-btn:hover {
        background: var(--orange);
      }
      .panel-photo-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        flex-shrink: 0;
        background: transparent;
        border: 1.5px solid var(--border2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        touch-action: manipulation;
        color: var(--text-secondary);
      }
      .panel-photo-btn:hover {
        border-color: var(--orange);
        color: var(--orange);
      }
      .panel-photo-btn svg {
        width: 18px;
        height: 18px;
      }
      .panel-send-btn svg {
        width: 18px;
        height: 18px;
        stroke: #fff;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Chat panel en modo gemelo: mismo estilo negro que la simulación ── */
      .chat-panel.gemelo-mode {
        background: #0d0d0d;
      }
      .chat-panel.gemelo-mode .panel-nav {
        background: #111;
        border-bottom-color: rgba(255, 117, 31, 0.18);
      }
      .chat-panel.gemelo-mode .panel-back {
        color: rgba(255, 255, 255, 0.6);
      }
      .chat-panel.gemelo-mode .panel-back:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .chat-panel.gemelo-mode .panel-person-name {
        color: #fff;
      }
      .chat-panel.gemelo-mode .panel-person-meta {
        color: rgba(255, 117, 31, 0.6);
      }
      .chat-panel.gemelo-mode .panel-mode-seg {
        background: rgba(255, 255, 255, 0.06);
      }
      .chat-panel.gemelo-mode .panel-mode-btn {
        color: rgba(255, 255, 255, 0.5);
      }
      .chat-panel.gemelo-mode .panel-mode-btn.active {
        background: var(--orange);
        color: #fff;
      }
      .chat-panel.gemelo-mode .panel-mode-btn.locked {
        opacity: 0.35;
      }
      .chat-panel.gemelo-mode .day-sep-line {
        background: rgba(255, 255, 255, 0.1);
      }
      .chat-panel.gemelo-mode .day-sep-text {
        color: rgba(255, 255, 255, 0.3);
      }
      .chat-panel.gemelo-mode .pmsg.them .pbubble {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 117, 31, 0.17);
        border-bottom-left-radius: 4px;
        color: rgba(255, 255, 255, 0.75);
      }
      .chat-panel.gemelo-mode .pmsg.them.is-gemelo .pbubble {
        border-left: 1px solid rgba(255, 117, 31, 0.17);
      }
      .chat-panel.gemelo-mode .pmsg.me .pbubble {
        background: rgba(255, 117, 31, 0.09);

      /* Lock toast */
      .lock-toast {

        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;

      .bnav-pip {

        height: 8px;
        border-radius: 50%;

      }
      .bnav-label {
        font-family: var(--font-body);
        font-size: 0.58rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .bnav-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px;
        background: none;
        border: none;

        text-decoration: none;
        touch-action: manipulation;
        min-height: 48px;
      }
      .bnav-center-orb {
        width: 50px;

      .bnav-center-orb svg {

      .bnav-center-label {
        font-family: var(--font-body);

        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;

      /* ── Simulation teaser card (top of gemelo chat) ── */
      .sim-teaser-card {
        background: rgba(255, 117, 31, 0.06);
        border: 1px solid rgba(255, 117, 31, 0.18);

        gap: 12px;

        width: 36px;

        justify-content: center;

      .sim-teaser-icon svg {
        width: 18px;

      .sim-teaser-text {
        flex: 1;

      .sim-teaser-arrow {
        flex-shrink: 0;

      /* ── Simulation overlay ── */
      .sim-overlay {
        position: fixed;

        z-index: 800;
        background: #0d0d0d;

      .sim-overlay.open {

        padding: 0 16px 0 8px;
        gap: 10px;

      }
      .sim-nav-back {

        justify-content: center;

        background: rgba(255, 255, 255, 0.06);

      .sim-nav-back svg {
        width: 20px;

        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;

      .sim-nav-info {
        flex: 1;

      .sim-badge {
        font-size: 0.6rem;

      .sim-body {

      .sim-inner {

      .sim-intro {
        background: rgba(255, 117, 31, 0.05);

      .sim-intro-label {
        font-size: 0.6rem;

        letter-spacing: 0.1em;

      .sim-intro-text {
        font-family: var(--font-serif);

      .sim-sep-text {

        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.17);
        white-space: nowrap;
      }
      /* Separador de ESCENARIO (distinto del de inicio/fin de toda la
      simulación, arriba) -- mucho más visible, para que se note claro

      .sim-scenario-sep {
        display: flex;

        margin-top: 14px;

      .sim-scenario-sep-line {
        flex: 1;
        height: 1px;

        align-items: center;
        gap: 6px;

      /* Simulation bubbles */
      .smsg {

        font-style: italic;
        font-weight: 300;
        line-height: 1.68;
        word-wrap: break-word;

      .smsg.them .sbubble {
        background: rgba(255, 255, 255, 0.04);

        border-bottom-left-radius: 4px;
        color: rgba(255, 255, 255, 0.75);
      }
      .smsg.me .sbubble {
        background: rgba(255, 117, 31, 0.09);

      }
      .smsg-label {
        display: block;
        font-family: var(--font-body);
        font-style: normal;
        font-size: 0.58rem;

        text-transform: uppercase;

      .smsg.them .smsg-label {
        color: var(--orange);
      }
      .smsg.me .smsg-label {

      }
      .smsg-time {

      .smsg.me .smsg-time {

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {

      #loadingOverlay {
        position: fixed;

        align-items: center;

      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ══════════════════════════════════════
   RESPONSIVE — MOBILE
══════════════════════════════════════ */
      @media (max-width: 600px) {
        /* Lista de chats — padding lateral */
        .conv-item {
          padding: 12px 12px;
        }

          padding: 8px 12px 4px;

        .mode-bar {
          padding: 8px 12px;
        }
      }

            <circle cx="11" cy="11" r="8" />

            autocomplete="off"
          />

      </div>

      <div class="conv-count" id="conv-count">0 conversaciones activas</div>

      <!-- Se arma dinámicamente desde Firestore (conexiones reales) -- ver
           cargarChatsReales() en el script de más abajo. -->
      <div class="conv-list" id="convList"></div>
      <div id="chatsEmpty" class="chats-empty" style="display: none">
        <svg
          viewBox="0 0 24 24"
          width="40"
          height="40"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"

    <script>
      // Se llena con datos reales de Firestore -- ver cargarChatsReales()
      // más abajo. openChat()/refreshListItem()/etc. leen de acá igual que antes.
      // "var" (no "let") a propósito: un top-level "let" en un <script>
      // clásico NO queda expuesto en window, así que el otro <script
      // type="module"> de más abajo (que es el que arma "people" con datos
      // reales de Firestore) no podría verlo -- "var" sí queda en window.
      var people = {};

      // Persona actualmente abierta en el panel de chat (ej: 'sofia', 'mateo')
      let curPerson = null;
      // Modo activo en el panel: 'gemelo' (chat con IA) o 'real' (chat directo con la persona)
      let curMode = null;

      /* ── Open chat panel ── */
      // Abre el panel lateral de chat para la persona con el id dado
      // Si el click fue en un botón de modo (gemelo/real), lo ignora para no interferir
      function openChat(id, e) {
        if (e && e.target.closest(".conv-mode-btn")) return;
        const p = people[id];
        curPerson = id;
        curMode = p.currentMode;

        document.getElementById("panelAv").style.cssText = p.photo
          ? `background-image:url('${p.photo}');background-size:cover;background-position:center;cursor:pointer`
          : `background:linear-gradient(135deg,#888,#555);cursor:pointer`;
        document.getElementById("panelAv").textContent = p.photo
          ? ""
          : (p.name[0] || "?").toUpperCase();
        document.getElementById("panelName").textContent = p.name;
        document.getElementById("panelMeta").textContent = [
          p.age ? `${p.age} años` : "",
          p.city,
          `${p.afinidad}% afinidad`,
        ]
          .filter(Boolean)
          .join(" · ");

        const realBtn = document.getElementById("pmBtnReal");
        realBtn.classList.toggle("locked", !p.realUnlocked);

        syncPanelModeBtns();
        updateModeBar();
        renderMessages();

        document.getElementById("chatPanel").classList.add("open");
        setTimeout(scrollBottom, 60);

        // Marcar como leído (en memoria y en Firestore)
        p.gemelo.unread = 0;
        if (p.real) p.real.unread = 0;
        refreshListItem(id);
        if (typeof window._db_marcarLeido === "function") {
          window._db_marcarLeido(id);
        }
      }

      // Cierra el panel de chat y resetea la persona y modo activos
      function closeChat() {
        document.getElementById("chatPanel").classList.remove("open");
        curPerson = null;
        curMode = null;
      }

      /* ── Panel mode switch ── */
      // Cambia entre modo gemelo (IA) y modo real (persona)
      // Si el chat real no está desbloqueado aún, muestra un toast de aviso y cancela
      function switchPanelMode(mode) {
        const p = people[curPerson];
        if (mode === "real" && !p.realUnlocked) {
          showToast();
          return;
        }
        curMode = mode;
        p.currentMode = mode;
        syncPanelModeBtns();
        updateModeBar();
        renderMessages();
        setTimeout(scrollBottom, 40);
        refreshListItem(curPerson);
      }

      // Actualiza visualmente cuál botón de modo (Gemelo / Real) está activo en el panel
      function syncPanelModeBtns() {
        document
          .getElementById("pmBtnGemelo")
          .classList.toggle("active", curMode === "gemelo");
        document
          .getElementById("pmBtnReal")
          .classList.toggle("active", curMode === "real");
        // Mandar fotos es solo para la persona real, nunca para el gemelo.
        document.getElementById("panelPhotoBtn").style.display =
          curMode === "real" ? "flex" : "none";
      }

      // Actualiza la barra de contexto del panel según el modo activo
      // En modo gemelo muestra "Hablás con el gemelo de X · Modo práctica"
      // En modo real muestra "Chat real con X · En línea"
      function updateModeBar() {
        const p = people[curPerson];
        const bar = document.getElementById("panelModeBar");
        const inp = document.getElementById("panelInput");
        document
          .getElementById("chatPanel")
          .classList.toggle("gemelo-mode", curMode === "gemelo");
        if (curMode === "gemelo") {
          bar.className = "panel-mode-bar gemelo-bar";
          bar.innerHTML = `
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span style="flex:1">Hablás con el <strong style="color:#fff">gemelo de ${esc(p.name)}</strong> · Modo práctica</span>
      ${p.simulacion && p.simulacion.length ? `<button onclick="openSimulation()" style="background:rgba(255,117,31,0.15);border:1px solid rgba(255,117,31,0.3);border-radius:10px;padding:3px 10px;font-size:0.62rem;font-weight:700;color:var(--orange);cursor:pointer;letter-spacing:0.03em;white-space:nowrap;touch-action:manipulation;flex-shrink:0">Ver simulación ↗</button>` : ""}
      <span class="mode-bar-badge" style="background:var(--orange);color:#fff">IA</span>`;
          inp.placeholder = `Preguntale algo al gemelo de ${p.name}...`;
        } else {
          bar.className = "panel-mode-bar real-bar";
          bar.innerHTML = `
      <span style="width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;display:inline-block"></span>
      <span style="flex:1">Chat real con <strong>${esc(p.name)}</strong></span>
      <span class="mode-bar-badge" style="background:rgba(34,197,94,0.15);color:#16a34a">En línea</span>`;
          inp.placeholder = `Escribile a ${p.name}...`;
        }
      }

      /* ── Render messages ── */
      // Limpia y redibuja todos los mensajes del chat abierto según la persona y modo activos
      // Agrega el separador "Hoy" y, en modo gemelo, la tarjeta de simulación al tope
      function renderMessages() {
        const p = people[curPerson];
        const md = p[curMode];
        const con = document.getElementById("panelMsgsInner");
        const isG = curMode === "gemelo";
        con.innerHTML = "";

        const sep = document.createElement("div");
        sep.className = "day-sep";
        sep.innerHTML =
          '<div class="day-sep-line"></div><span class="day-sep-text">Hoy</span><div class="day-sep-line"></div>';
        con.appendChild(sep);

        // Tarjeta de simulación al tope del chat gemelo
        if (isG && p.simulacion && p.simulacion.length) {
          const card = document.createElement("div");
          card.className = "sim-teaser-card";
          card.onclick = openSimulation;
          card.innerHTML = `
      <div class="sim-teaser-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
      </div>
      <div class="sim-teaser-text">
        <div class="sim-teaser-title">Tu gemelo y el de ${esc(p.name)} ya se conocieron</div>
        <div class="sim-teaser-sub">Ver la conversación que tuvieron antes de que ustedes se conectaran</div>
      </div>
      <div class="sim-teaser-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>`;
          con.appendChild(card);
        }

        (md.msgs || []).forEach((msg) => addMsgEl(con, msg, p, isG));
      }

      // Contenido de una burbuja: si el mensaje trae foto (solo pasa en modo
      // "real", nunca con el gemelo) se muestra la imagen en vez del texto,
      // tocable para agrandarla (mismo lightbox que el perfil).
      function _bubbleContent(msg) {
        if (msg.photo) {
          return `<img class="pbubble-photo" src="${msg.photo}" onclick="openLightbox('${msg.photo}')" alt="Foto" />`;
        }
        return esc(msg.text);
      }

      // Crea y agrega un elemento de mensaje al contenedor del chat
      // El estilo varía según si es mensaje propio (me), del gemelo IA (isG) o de la persona real (them)
      function addMsgEl(container, msg, p, isG) {
        // "gemelo" sigue con "me"/"them" relativo (sin cambios); "real" usa
        // el uid real de quien escribió cada mensaje, porque el mismo doc
        // lo leen las dos cuentas y "me" no tiene sentido ahí.
        const isMe = isG ? msg.from === "me" : msg.from === window._uid;
        const div = document.createElement("div");
        div.className = `pmsg ${isMe ? "me" : "them"}${!isMe && isG ? " is-gemelo" : ""}${msg.photo ? " has-photo" : ""}`;

        if (isMe) {
          div.innerHTML = `<span class="pmsg-time">${msg.time}</span><div class="pbubble">${_bubbleContent(msg)}</div>`;
        } else if (isG) {
          div.innerHTML = `
      <div class="pmsg-av pmsg-av-ai" style="background:${p.color}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      </div>
      <div class="pbubble"><span class="gemelo-tag">Gemelo de ${esc(p.name)}</span>${_bubbleContent(msg)}</div>
      <span class="pmsg-time">${msg.time}</span>`;
        } else {
          div.innerHTML = `
      <div class="pmsg-av" style="${p.photo ? `background-image:url('${p.photo}');background-size:cover;background-position:center` : "background:linear-gradient(135deg,#888,#555)"}">${p.photo ? "" : esc((p.name[0] || "?").toUpperCase())}</div>
      <div class="pbubble">${_bubbleContent(msg)}</div>
      <span class="pmsg-time">${msg.time}</span>`;
        }
        container.appendChild(div);
      }

      /* ── Send message ── */
      // Envía el mensaje del usuario, lo guarda en memoria y en Firestore
      // Si es el primer mensaje con esa persona, inyecta el ítem en la lista de conversaciones
      // Después de 300ms muestra typing y genera una respuesta automática
      function sendPanelMsg() {
        const input = document.getElementById("panelInput");
        const text = input.value.trim();
        if (!text || !curPerson) return;
        const p = people[curPerson];
        const md = p[curMode];
        const persona = curPerson;
        const mode = curMode;
        const t = nowTime();
        // "real" guarda el uid real de quien escribe (no "me"/"them"
        // relativo) -- el mismo documento lo leen las dos cuentas, así que
        // "me" no significa nada ahí. "gemelo" sigue con "me"/"them" como
        // siempre, no se tocó ese modo.
        const msg = {
          id: `${Date.now()}_${Math.random().toString(36).slice(2)}`,
          from: mode === "real" ? window._uid : "me",
          text,
          time: t,
        };
        md.msgs.push(msg);
        md.lastTime = t;
        // Primer mensaje con esta persona → inyectar en la lista de conversaciones
        if (md.msgs.length === 1) {
          injectConvItem(persona);
        }
        renderMessages();
        refreshListItem(persona);
        input.value = "";
        panelResize(input);
        setTimeout(scrollBottom, 40);

        if (mode === "real") {
          // Chat real entre las dos cuentas: se guarda con arrayUnion (no
          // pisa lo que la otra persona haya escrito un instante antes) y
          // nada se inventa acá -- la respuesta real de la otra persona
          // llega sola por el listener en vivo (onSnapshot, ver
          // cargarChatsReales) cuando ella la escriba de verdad.
          if (typeof window._db_agregarMensajeReal === "function") {
            window._db_agregarMensajeReal(persona, msg);
          }
          return;
        }

        // Modo "gemelo": chat en vivo con el gemelo real del match.
        if (typeof window._db_saveChat === "function") {
          window._db_saveChat(persona, mode, [...md.msgs]);
        }

        setTimeout(() => {
          addTyping();
          (async () => {
            // Llama de verdad al gemelo del match (chatear_con_gemelo_match)
            // -- reemplaza el autoReply() enlatado con nombres de demo que
            // había acá antes. El historial excluye el mensaje que se acaba
            // de mandar (ya va aparte como "mensaje" al backend).
            let reply;
            try {
              const historial = md.msgs
                .slice(0, -1)
                .slice(-8)
                .map((m) => ({
                  role: m.from === "me" ? "user" : "assistant",
                  content: m.text,
                }));
              reply = await window._llamarChatGemeloMatch(
                persona,
                text,
                historial,
              );
            } catch (err) {
              console.error("Error en chatear_con_gemelo_match:", err);
              reply =
                "No pude responder ahora mismo. Probá de nuevo en un rato.";
            }
            removeTyping();
            md.msgs.push({ from: "them", text: reply, time: nowTime() });
            md.lastTime = nowTime();
            // Si seguís mirando esta misma conversación cuando llega la
            // respuesta, se da por leída al toque (en vez de sumarla a los
            // no leídos); si no, sí cuenta como no leído -- el contador
            // tiene que poder subir, no solo bajar.
            const sigueAbierto = curPerson === persona && curMode === mode;
            if (sigueAbierto) {
              if (typeof window._db_marcarLeido === "function") {
                window._db_marcarLeido(persona);
              }
            } else {
              md.unread = (md.unread || 0) + 1;
            }
            renderMessages();
            refreshListItem(persona);
            setTimeout(scrollBottom, 40);
            // Guardar respuesta real en Firestore
            if (typeof window._db_saveChat === "function") {
              window._db_saveChat(persona, mode, [...md.msgs]);
            }
          })();
        }, 300);
      }

      /* ── Send photo (solo chat real, nunca al gemelo) ── */

      // HEIC/HEIF (formato típico de fotos de iPhone/Mac) no lo puede
      // decodificar un <img> -- mismo problema y mismo arreglo que ya se
      // hizo en perfil.html para subir fotos de perfil.
      function _pareceHeicChat(file) {
        const tipo = (file.type || "").toLowerCase();
        if (tipo.includes("heic") || tipo.includes("heif")) return true;
        const nombre = (file.name || "").toLowerCase();
        return nombre.endsWith(".heic") || nombre.endsWith(".heif");
      }

      let _heic2anyCargandoChat = null;
      function _cargarHeic2anyChat() {
        if (window.heic2any) return Promise.resolve();
        if (_heic2anyCargandoChat) return _heic2anyCargandoChat;
        _heic2anyCargandoChat = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src =
            "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
          script.onload = () => resolve();
          script.onerror = () =>
            reject(new Error("No se pudo cargar el conversor de HEIC"));
          document.head.appendChild(script);
        });
        return _heic2anyCargandoChat;
      }

      // El chat entero (todos los mensajes de la pareja) vive en un solo
      // documento de Firestore con un techo de 1MB -- cada foto tiene que
      // pesar lo menos posible sin quedar ilegible. Arranca en calidad alta
      // y solo la baja de a pasos si hace falta (mismo criterio que
      // canvasToCompressedDataUrl en perfil.html).
      function _comprimirFotoChat(
        img,
        { maxLado = 1000, targetBytes = 150000, minQuality = 0.5 } = {},
      ) {
        const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * escala);
        canvas.height = Math.round(img.height * escala);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);
        while (dataUrl.length > targetBytes && quality > minQuality) {
          quality = Math.round((quality - 0.1) * 10) / 10;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }
        return dataUrl;
      }

      // Handler del <input type="file"> del botón de adjuntar foto.
      async function handlePanelPhotoSelected(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = ""; // permite elegir la misma foto de nuevo después
        if (!file || !curPerson || curMode !== "real") return;

        let archivo = file;
        if (_pareceHeicChat(file)) {
          try {
            await _cargarHeic2anyChat();
            const resultado = await window.heic2any({
              blob: file,
              toType: "image/jpeg",
              quality: 0.9,

            console.error("Error convirtiendo HEIC:", e);
            alert(

            );
            return;
          }
        }

        const reader = new FileReader();
        reader.onerror = () => alert("No se pudo leer la imagen");
        reader.onload = () => {
          const img = new Image();
          img.onerror = () =>
            alert("No se pudo procesar la imagen -- probá con otra (JPG o PNG)");
          img.onload = () => sendPanelPhoto(_comprimirFotoChat(img));

      function openSimulation() {

        escenarios.forEach((sim, i) => {

          sim.mensajes.forEach((msg) => {

      /* ── Helpers ── */

      // Devuelve la hora actual en formato HH:MM (horario Argentina)

      // Escapa caracteres especiales de HTML para evitar inyección de código en los mensajes
      function esc(t) {
        return String(t)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

      // Detecta Enter en el input del panel para enviar el mensaje (Shift+Enter hace salto de línea)
      function handlePanelKey(e) {

      // Si la página fue abierta con ?persona=ID (desde home o matches), abre ese
      // chat directamente -- se ejecuta desde cargarChatsReales() (script de más

      // altura todavía no cargó nada de Firestore.
      // ?modo=real fuerza el chat con la persona real (ej: botón "Escribirle a
      // X" de matches.html) -- sin esto, openChat() abría el modo que haya
      // quedado guardado en currentMode, que en un match sin mensajes reales
      // todavía por defecto es "gemelo", así que "Escribirle" mandaba al chat
      // con el gemelo en vez de con la persona.
      function abrirChatDesdeQueryParam() {
        const params = new URLSearchParams(location.search);
        const param = params.get("persona");
        const modo = params.get("modo");
        if (param && people[param]) {
          openChat(param);
          if (modo === "real" || modo === "gemelo") {
            switchPanelMode(modo);

          // Sacamos el ?persona=/?modo= de la URL para que un refresh no
          // vuelva a abrir el chat si el usuario ya lo cerró.
          history.replaceState(null, "", location.pathname + location.hash);
        }

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {

      import {

      function parId(a, b) {

      function calcAge(fechaNac) {
        if (!fechaNac) return null;
        const b = new Date(fechaNac),
          hoy = new Date();
        let a = hoy.getFullYear() - b.getFullYear();
        const m = hoy.getMonth() - b.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < b.getDate())) a--;
        return a;
      }

      const app = initializeApp({
        apiKey: "AIzaSyDmjdP3DraX6DkBbW6fffI_gKoRcCp6UY0",
        authDomain: "pebble-78e95.firebaseapp.com",

      const auth = getAuth(app);
      const db = getFirestore(app);
      const functionsInstance = getFunctions(app);
      const chatearConGemeloMatchCallable = httpsCallable(

      // Bridge para el script clásico (sendPanelMsg) -- reemplaza el

      window._llamarChatGemeloMatch = async function (

        const res = await chatearConGemeloMatchCallable({
          otroUid,

      let uid = null;

      // Cache de perfil + última simulación por otroId -- se trae una sola
      // vez (no en cada snapshot en vivo) porque no cambia seguido y no
      // vale la pena repetir esas lecturas cada vez que llega un mensaje
      // nuevo.
      const _perfilesCache = {};
      let _primeraCargaChats = true;

      // Arma "people" con matches reales (conexiones donde supera_umbral es
      // true) -- reemplaza la lista fija de 5 personas demo. Para cada uno
      // trae el perfil real de la otra persona y su última simulación real
      // (para el teaser "Ver simulación"). El no-leídos se calcula desde
      // vistoHasta (cuántos mensajes ya vio) contra los mensajes reales de

      //
      // Usa onSnapshot en vez de un getDocs de una sola vez: así, cuando la
      // otra cuenta te escribe un mensaje real, aparece solo acá sin
      // recargar la página (antes no había forma de enterarse sin volver a
      // entrar a la pantalla).
      function cargarChatsReales(user, mis) {
        return new Promise((resolveInicial) => {
          onSnapshot(
            query(
              collection(db, "conexiones"),
              where("participantes", "array-contains", user.uid),
            ),
            async (conexionesSnap) => {
              const candidatos = [];
              conexionesSnap.forEach((d) => {
                const data = d.data();
                if (!data.supera_umbral) return;
                const otroId =
                  data.usuario_1.uid === user.uid
                    ? data.usuario_2.uid
                    : data.usuario_1.uid;
                candidatos.push({ parId: d.id, otroId, data });
              });

              if (!candidatos.length) {
                const emptyEl = document.getElementById("chatsEmpty");
                if (emptyEl) emptyEl.style.display = "flex";
                if (_primeraCargaChats) {
                  _primeraCargaChats = false;
                  resolveInicial();
                }
                return;
              }

              await Promise.all(
                candidatos.map(async (c) => {
                  if (_perfilesCache[c.otroId]) {
                    c.otro = _perfilesCache[c.otroId].otro;
                    c.simulaciones = _perfilesCache[c.otroId].simulaciones;
                    return;
                  }
                  try {
                    const s = await getDoc(doc(db, "usuarios", c.otroId));
                    c.otro = s.exists() ? s.data() : {};
                  } catch (e) {
                    c.otro = {};
                  }
                  try {
                    // TODOS los escenarios simulados con esta persona -- antes
                    // limit(1) solo traía el último, así que si el match
                    // corrió varios escenarios preestablecidos se perdían
                    // todos menos uno.
                    const simSnap = await getDocs(
                      query(
                        collection(db, "conexiones", c.parId, "simulaciones"),
                        orderBy("fecha", "asc"),
                      ),
                    );
                    c.simulaciones = simSnap.docs.map((d) => d.data());
                  } catch (e) {
                    c.simulaciones = [];
                  }
                  _perfilesCache[c.otroId] = {
                    otro: c.otro,
                    simulaciones: c.simulaciones,
                  };
                }),
              );

              const misIntereses = mis.intereses || [];
              let hayConversaciones = false;

              candidatos.forEach((c) => {
                const id = c.otroId;
                const nombreGuardado =
                  c.data.usuario_1.uid === id
                    ? c.data.usuario_1.nombre
                    : c.data.usuario_2.nombre;
                const nombre = c.otro.nombre || nombreGuardado || "Usuario";
                const susIntereses = c.otro.intereses || [];

                // Un elemento por escenario simulado (no un solo chat) -- así
                // se pueden mostrar TODOS los que se corrieron con esta
                // persona, no solo el último.
                const simulacion = (c.simulaciones || [])
                  .filter((sim) => Array.isArray(sim.historial_chat))
                  .map((sim) => {
                    const horaSim = sim.fecha
                      ? new Date(sim.fecha).toLocaleTimeString("es-AR", {
                          hour: "2-digit",
                          minute: "2-digit",
                        })
                      : "";
                    return {
                      escenario: (sim.escenario && sim.escenario.titulo) || "",
                      mensajes: sim.historial_chat.map((msg) => ({
                        // msg.uid es lo confiable (agregado hace poco) -- antes
                        // solo estaba msg.name comparado contra mis.nombre, y
                        // esos dos campos pueden no coincidir (el nombre del
                        // perfil del gemelo, de la etapa1 del onboarding, no
                        // es necesariamente el mismo que el nombre de cuenta),
                        // lo que atribuía TODOS los mensajes al gemelo ajeno.
                        from: msg.uid
                          ? msg.uid === user.uid
                            ? "mi-gemelo"
                            : "su-gemelo"
                          : msg.name && mis.nombre && msg.name === mis.nombre
                            ? "mi-gemelo"
                            : "su-gemelo",
                        text: msg.content || "",
                        time: horaSim,
                      })),
                    };
                  });

                const real = c.data.real || {};
                const gemelo = c.data.gemelo || {};
                const realMsgs = Array.isArray(real.msgs) ? real.msgs : [];
                const gemeloMsgs = Array.isArray(gemelo.msgs)
                  ? gemelo.msgs
                  : [];
                // "real" es un doc compartido por dos cuentas -- vistoHasta
                // tiene que ser por usuario (real.vistoHasta = {uid: cant})
                // porque si fuera un solo número, cualquiera de los dos lo
                // pisaría con solo abrir el chat. El no-leído cuenta
                // mensajes que NO escribió esta cuenta (from !== mi uid).
                // "gemelo" sigue con un solo usuario tipeando de verdad
                // (el otro lado es la IA), así que ahí el esquema viejo
                // "them"/número plano sigue siendo válido.
                const vistoHastaReal =
                  real.vistoHasta && typeof real.vistoHasta === "object"
                    ? real.vistoHasta[user.uid] || 0
                    : 0;
                const realUnread = realMsgs
                  .slice(vistoHastaReal)
                  .filter((m) => m.from !== user.uid).length;
                const gemeloUnread = gemeloMsgs
                  .slice(gemelo.vistoHasta || 0)
                  .filter((m) => m.from === "them").length;

                // Nombre y edad siempre se muestran -- el resto respeta lo
                // que la otra persona eligió en Privacidad (perfil.html).
                // Ciudad/fotos/bio nacen visibles (solo se ocultan si puso
                // === false); género/orientación nacen ocultos (solo se
                // muestran si puso === true).
                const privOtro = c.otro.privacidad || {};
                const fotosVisiblesOtro = privOtro.fotos !== false;
                const identidadOtro = [
                  privOtro.genero === true ? c.otro.genero : "",
                  privOtro.orientacion === true ? c.otro.orientacion : "",
                ]
                  .filter(Boolean)
                  .join(" · ");

                people[id] = {
                  name: nombre,
                  color: "linear-gradient(135deg,#FF9700,#FF751F)",
                  photo: fotosVisiblesOtro
                    ? c.otro.avatarFoto ||
                      (Array.isArray(c.otro.fotos) && c.otro.fotos.find(Boolean)) ||
                      ""
                    : "",
                  age: calcAge(c.otro.fechaNac),
                  city: privOtro.ciudad === false ? "" : c.otro.ciudad || "",
                  identidad: identidadOtro,
                  afinidad: Math.round((c.data.ultimo_score || 0) * 100),
                  bio: privOtro.bio === false ? "" : c.otro.bio || "",
                  interests: susIntereses,
                  sharedInterests: misIntereses.filter((i) =>
                    susIntereses.includes(i),
                  ),
                  photos: fotosVisiblesOtro
                    ? (Array.isArray(c.otro.fotos) ? c.otro.fotos : []).filter(
                        Boolean,
                      )
                    : [],
                  realUnlocked: true,
                  currentMode:
                    (people[id] && people[id].currentMode) ||
                    (realMsgs.length ? "real" : "gemelo"),
                  simulacion,
                  gemelo: {
                    lastTime: gemeloMsgs.length
                      ? gemeloMsgs[gemeloMsgs.length - 1].time || ""
                      : "",
                    unread: gemeloUnread,
                    msgs: gemeloMsgs,
                  },
                  real: {
                    lastTime: realMsgs.length
                      ? realMsgs[realMsgs.length - 1].time || ""
                      : "",
                    unread: realUnread,
                    msgs: realMsgs,
                  },
                };

                if (realMsgs.length > 0 || gemeloMsgs.length > 0) {
                  hayConversaciones = true;
                  injectConvItem(id);
                }
              });

              const emptyEl = document.getElementById("chatsEmpty");
              if (emptyEl)
                emptyEl.style.display = hayConversaciones ? "none" : "flex";

              // El chat que esté abierto se re-renderiza con los datos
              // frescos de este snapshot -- así, si es un mensaje nuevo de
              // la otra cuenta, aparece solo sin recargar la página.
              if (curPerson && people[curPerson]) {
                renderMessages();
                refreshListItem(curPerson);
              }

              if (_primeraCargaChats) {
                _primeraCargaChats = false;
                abrirChatDesdeQueryParam();
                resolveInicial();
              }
            },
          );
        });
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "./home.html";
          return;
        }
        // Expiración de sesión (24h)
        const _SESSION_MS = 24 * 60 * 60 * 1000;
        const _loginTime = parseInt(
          localStorage.getItem("pebble_login_time") || "0",
        );
        if (!_loginTime) {
          localStorage.setItem("pebble_login_time", Date.now().toString());
        } else if (Date.now() - _loginTime > _SESSION_MS) {
          localStorage.removeItem("pebble_login_time");
          await signOut(auth);
          window.location.href = "./home.html";
          return;
        }
        uid = user.uid;
        // El script clásico (sendPanelMsg/addMsgEl) no ve las variables de
        // este script módulo -- se expone acá para que pueda comparar
        // "¿este mensaje lo escribí yo?" contra el uid real en vez de un
        // "me" relativo que no significa nada en un doc compartido por dos
        // cuentas.
        window._uid = uid;

        // ── Cargar conversaciones guardadas de Firestore ──
        // Los chats viven en conexiones/{parId}, un solo doc compartido por
        // pareja -- cargarChatsReales() arma "people" con los matches reales
        // (conexiones/{parId} donde supera_umbral es true) en vez de la
        // lista fija de 5 personas demo que había antes.
        try {
          const snap = await getDoc(doc(db, "usuarios", uid));
          const mis = snap.exists() ? snap.data() : {};
          const nombreNav =
            mis.nombre ||
            user.displayName ||
            (user.email ? user.email.split("@")[0] : "") ||
            "Usuario";
          renderNavAvatar(mis.avatarFoto, nombreNav);

          // Punto naranja del ícono de notificaciones: solo si hay
          // notificaciones reales sin leer (usuarios/{uid}/notificaciones,
          // leida=false) -- ver notificaciones.html / main.py.
          try {
            const notifsSnap = await getDocs(
              query(
                collection(db, "usuarios", uid, "notificaciones"),
                where("leida", "==", false),
              ),
            );
            const pip = document.querySelector(".nav-icon-btn .notif-pip");
            if (pip) pip.style.display = notifsSnap.size > 0 ? "" : "none";
          } catch (e) {
            console.warn("Error contando notificaciones sin leer:", e);
          }

          await cargarChatsReales(user, mis);
        } catch (e) {
          console.warn("Error cargando chats:", e);
          const emptyEl = document.getElementById("chatsEmpty");
          if (emptyEl) emptyEl.style.display = "flex";
        }

        // Quitar overlay cuando todo esté listo
        const el = document.getElementById("loadingOverlay");
        if (el) {
          el.classList.add("hide");
          setTimeout(() => el.remove(), 350);
        }
      });

      // Arma el par usuario_1/usuario_2 en orden estable (el más chico de los
      // dos uid primero) -- así siempre queda igual sin importar cuál de los
      // dos usuarios está escribiendo, que es lo que espera el backend.
      // "participantes" es lo que usan las reglas y la query de carga.
      function parUsuarios(personaId) {
        const base =
          String(uid) < String(personaId)
            ? { usuario_1: { uid }, usuario_2: { uid: personaId } }
            : { usuario_1: { uid: personaId }, usuario_2: { uid } };
        return { ...base, participantes: [uid, personaId] };
      }

      // Marca ambos modos (gemelo y real) de una conversación como leídos en Firestore
      // Se llama al abrir el panel de chat para eliminar los badges de no leídos
      // Guarda hasta qué mensaje (índice) ya vio el usuario, por modo --
      // reemplaza el flag booleano "leido" de antes. Con un booleano el
      // contador de no leídos solo podía bajar a 0 y quedarse ahí; con un
      // índice se puede recalcular en cada carga cuántos mensajes de "them"
      // llegaron después de ese punto, así que sube y baja como corresponde.
      window._db_marcarLeido = async (personaId) => {
        if (!uid) return;
        const p = window.people && window.people[personaId];
        const realHasta = p && p.real ? p.real.msgs.length : 0;
        const gemeloHasta = p && p.gemelo ? p.gemelo.msgs.length : 0;
        const ref = doc(db, "conexiones", parId(uid, personaId));
        try {
          // real.vistoHasta es un mapa por uid (real.vistoHasta.<mi uid>) --
          // no un número plano -- porque el doc lo comparten las dos
          // cuentas y cada una tiene que poder marcar SU propio punto de
          // lectura sin pisar el de la otra. gemelo.vistoHasta sigue siendo
          // un número plano: ahí solo escribe esta cuenta, el otro lado es
          // la IA.
          await updateDoc(ref, {
            [`real.vistoHasta.${uid}`]: realHasta,
            "gemelo.vistoHasta": gemeloHasta,
          });
        } catch (e) {
          // El documento todavía no existe (primera vez que se toca esta conversación)
          await setDoc(
            ref,
            {
              ...parUsuarios(personaId),
              real: { vistoHasta: { [uid]: realHasta } },
              gemelo: { vistoHasta: gemeloHasta },
            },
            { merge: true },
          );
        }
      };

      // Guarda el array completo de mensajes de una conversación en Firestore,
      // en conexiones/{parId} con la forma { usuario_1, usuario_2, real: {...}, gemelo: {...} }
      window._db_saveChat = async (personaId, mode, msgs) => {
        if (!uid) return;
        const ref = doc(db, "conexiones", parId(uid, personaId));
        // "real.ultimaActividad" (solo en modo real) es lo que usa
        // generar_recordatorios_diarios en el backend para saber hace
        // cuánto no hay mensajes nuevos y avisar "¿Retomás con X?" -- por
        // eso es un Timestamp real, no el "HH:MM" de md.lastTime (que no
        // sirve para calcular días de diferencia).
        const campos = { [`${mode}.msgs`]: msgs };
        if (mode === "real") campos["real.ultimaActividad"] = serverTimestamp();
        try {
          await updateDoc(ref, campos);
        } catch (e) {
          // El documento todavía no existe (primer mensaje con esta persona)
          const modoData =
            mode === "real"
              ? { msgs, ultimaActividad: serverTimestamp() }
              : { msgs };
          await setDoc(
            ref,
            { ...parUsuarios(personaId), [mode]: modoData },
            { merge: true },
          );
        }
      };

      // Agrega UN mensaje real al chat con un match -- a diferencia de
      // _db_saveChat (que reescribe el array entero, pensado para cuando un
      // solo lado escribe todo el historial), acá dos cuentas reales
      // pueden escribir casi al mismo tiempo, así que se usa arrayUnion:
      // una operación atómica de Firestore que agrega sin pisar lo que la
      // otra cuenta haya guardado un instante antes.
      window._db_agregarMensajeReal = async (personaId, mensaje) => {
        if (!uid) return;
        const ref = doc(db, "conexiones", parId(uid, personaId));
        const campos = {
          "real.msgs": arrayUnion(mensaje),
          "real.ultimaActividad": serverTimestamp(),
        };
        try {
          await updateDoc(ref, campos);
        } catch (e) {
          // El documento todavía no existe (primer mensaje real con esta persona)
          await setDoc(
            ref,
            {
              ...parUsuarios(personaId),
              real: { msgs: [mensaje], ultimaActividad: serverTimestamp() },
            },
            { merge: true },
          );
        }
      };
    </script>
  </body>
</html>
